<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">
        📊 Dashboard
    </div>

    <div class="menu">
        <a href="/admin">⬅ Volver</a>
    </div>

</header>

<div class="dashboard">

    <div class="card">
        <h2>📦 Productos</h2>
        <p>{{ total_productos }}</p>
    </div>

    <div class="card">
        <h2>👤 Usuarios</h2>
        <p>{{ total_usuarios }}</p>
    </div>

    <div class="card">
        <h2>🛒 Compras</h2>
        <p>{{ total_compras }}</p>
    </div>

    <div class="card">
        <h2>💰 Ventas</h2>
        <p>S/ {{ "%.2f"|format(ventas_totales) }}</p>
    </div>

</div>

</body>
</html>
