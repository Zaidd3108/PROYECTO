<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="carrito-page">

    <h1>➕ Nuevo Producto</h1>

    <form method="POST">

        <input type="text"
               name="nombre"
               placeholder="Nombre"
               required>

        <br><br>

        <input type="number"
               step="0.01"
               name="precio"
               placeholder="Precio"
               required>

        <br><br>

        <input type="text"
               name="categoria"
               placeholder="Categoría"
               required>

        <br><br>

        <input type="text"
               name="imagen"
               placeholder="imagen.webp"
               required>

        <br><br>

        <button type="submit">
            Guardar Producto
        </button>

    </form>

</div>

</body>

</html>
