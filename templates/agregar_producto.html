<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">
        ➕ Nuevo Producto
    </div>

    <div class="menu">
        <a href="/admin">⬅ Volver</a>
    </div>

</header>

<div class="carrito-page">

    <form method="POST">

        <input
            type="text"
            name="nombre"
            placeholder="Nombre del producto"
            required>

        <br><br>

        <input
            type="number"
            step="0.01"
            name="precio"
            placeholder="Precio"
            required>

        <br><br>

        <input
            type="text"
            name="categoria"
            placeholder="Categoría"
            required>

        <br><br>

        <input
            type="text"
            name="imagen"
            placeholder="ejemplo.webp"
            required>

        <br><br>

        <button type="submit">
            Guardar Producto
        </button>

    </form>

</div>

</body>
</html>
