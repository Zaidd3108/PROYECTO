<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">
        ➕ Nuevo Producto
    </div>

    <div class="menu">
        <a href="/admin">⬅ Volver al Panel</a>
    </div>

</header>

<div class="form-admin">

    <h1>Registrar Producto</h1>

    <form method="POST">

        <label>Nombre del producto</label>

        <input
            type="text"
            name="nombre"
            placeholder="Ej: Coca Cola 3L"
            required>

        <label>Precio</label>

        <input
            type="number"
            step="0.01"
            name="precio"
            placeholder="Ej: 12.50"
            required>

        <label>Categoría</label>

        <select name="categoria" required>

            <option value="">
                Seleccionar categoría
            </option>

            <option value="Abarrotes">
                🥫 Abarrotes
            </option>

            <option value="Lácteos">
                🥛 Lácteos
            </option>

            <option value="Bebidas">
                🥤 Bebidas
            </option>

            <option value="Limpieza">
                🧴 Limpieza
            </option>

        </select>

        <label>Imagen</label>

        <input
            type="text"
            name="imagen"
            placeholder="ejemplo.webp"
            required>

        <button type="submit">
            💾 Guardar Producto
        </button>

    </form>

</div>

</body>

</html>
