<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <h1>✏️ Editar Producto</h1>

    <form method="POST">

        <label>Nombre</label>
        <input type="text"
               name="nombre"
               value="{{ producto.nombre }}"
               required>

        <label>Precio</label>
        <input type="number"
               step="0.01"
               name="precio"
               value="{{ producto.precio }}"
               required>

        <label>Categoría</label>
        <input type="text"
               name="categoria"
               value="{{ producto.categoria }}"
               required>

        <label>Imagen</label>
        <input type="text"
               name="imagen"
               value="{{ producto.imagen }}"
               required>

        <button type="submit">
            Guardar Cambios
        </button>

    </form>

</div>

</body>
</html>
