<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">
        ✏️ Editar Producto
    </div>

    <div class="menu">
        <a href="/admin">⬅ Volver al Panel</a>
    </div>

</header>

<div class="form-admin">

    <h1>Modificar Producto</h1>

    <form method="POST">

        <label>Nombre del producto</label>

        <input
            type="text"
            name="nombre"
            value="{{ producto.nombre }}"
            required>

        <label>Precio</label>

        <input
            type="number"
            step="0.01"
            name="precio"
            value="{{ producto.precio }}"
            required>

        <label>Categoría</label>

        <select name="categoria" required>

            <option value="Abarrotes"
                {% if producto.categoria == "Abarrotes" %}selected{% endif %}>
                🥫 Abarrotes
            </option>

            <option value="Lácteos"
                {% if producto.categoria == "Lácteos" %}selected{% endif %}>
                🥛 Lácteos
            </option>

            <option value="Bebidas"
                {% if producto.categoria == "Bebidas" %}selected{% endif %}>
                🥤 Bebidas
            </option>

            <option value="Limpieza"
                {% if producto.categoria == "Limpieza" %}selected{% endif %}>
                🧴 Limpieza
            </option>

        </select>

        <label>Imagen</label>

        <input
            type="text"
            name="imagen"
            value="{{ producto.imagen }}"
            required>

        <br>

        <img
            src="{{ url_for('static', filename='img/' + producto.imagen) }}"
            class="preview-admin">

        <button type="submit">
            💾 Guardar Cambios
        </button>

    </form>

</div>

</body>

</html>
