<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>

        <div class="logo">
            ✏️ Editar Producto
        </div>

        <div class="menu">
            <a href="/admin">⬅ Volver al Panel</a>
        </div>

    </header>

    <div class="form-admin">

        <h1>Modificar Producto</h1>

        <form method="POST" enctype="multipart/form-data">

            <label>Nombre del producto</label>

            <input type="text" name="nombre" value="{{ producto.nombre }}" required>

            <label>Precio</label>

            <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required>

            <label>Categoría</label>

            <select name="categoria" required>

                <option value="Abarrotes" {% if producto.categoria=="Abarrotes" %}selected{% endif %}>
                    🥫 Abarrotes
                </option>

                <option value="Lácteos" {% if producto.categoria=="Lácteos" %}selected{% endif %}>
                    🥛 Lácteos
                </option>

                <option value="Bebidas" {% if producto.categoria=="Bebidas" %}selected{% endif %}>
                    🥤 Bebidas
                </option>

                <option value="Limpieza" {% if producto.categoria=="Limpieza" %}selected{% endif %}>
                    🧴 Limpieza
                </option>

            </select>

            <label>Imagen del producto</label>

            <input type="file" name="imagen" id="imagen" accept="image/*">

            <input type="hidden" name="imagen_actual" value="{{ producto.imagen }}">

            <div style="text-align:center;">

                <p style="margin-top:15px; font-weight:bold;">
                    Imagen actual
                </p>

                <img id="preview" src="{{ url_for('static', filename='img/' + producto.imagen) }}"
                    class="preview-admin">

            </div>

            <button type="submit">
                💾 Guardar Cambios
            </button>

        </form>

    </div>

    <script>

        document.getElementById("imagen").addEventListener("change", function (event) {

            const archivo = event.target.files[0];

            if (archivo) {

                const lector = new FileReader();

                lector.onload = function (e) {

                    document.getElementById("preview").src = e.target.result;

                };

                lector.readAsDataURL(archivo);

            }

        });

    </script>

</body>

</html>
